<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">EmotionSketch-BGM: from emotion intent to target MIDI</title>
<desc id="desc">Prompt-to-Q maps Chinese text to a target emotion label. EmotionSketch adapts visual features using a continuous sketch and the label. Frozen Diff-BGM performs teacher-forced conditional denoising. MIDI candidates are scored and selected by MFAE using 48 EMOPIA-derived features.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#657086"/></marker></defs>
<rect width="1200" height="900" rx="16" fill="#f8f9fc"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
<text x="48" y="53" font-size="28" font-weight="650" fill="#75639c">01  /  EXPRESS THE EMOTION</text>
<rect x="48" y="85" width="320" height="150" rx="12" fill="#ffffff" stroke="#d5dbe5" stroke-width="1.5"/>
<text x="70" y="127" font-size="28" font-weight="650" fill="#20283e">Emotion prompt</text>
<text x="70" y="164" font-size="22" font-weight="400" fill="#526078">Chinese natural language</text>
<text x="70" y="193" font-size="22" font-weight="400" fill="#526078">e.g. warm, calm, soothing</text>
<rect x="440" y="85" width="320" height="150" rx="12" fill="#f0edf7" stroke="#d6cfe4" stroke-width="1.5"/>
<text x="462" y="127" font-size="28" font-weight="650" fill="#20283e">Prompt-to-Q</text>
<text x="462" y="164" font-size="22" font-weight="400" fill="#526078">Character n-grams</text>
<text x="462" y="193" font-size="22" font-weight="400" fill="#526078">Linear softmax classifier</text>
<rect x="832" y="85" width="320" height="150" rx="12" fill="#f0edf7" stroke="#d6cfe4" stroke-width="1.5"/>
<text x="854" y="127" font-size="28" font-weight="650" fill="#20283e">Target label q</text>
<text x="854" y="164" font-size="22" font-weight="400" fill="#526078">Q1 · Q2 · Q3 · Q4</text>
<text x="854" y="193" font-size="22" font-weight="400" fill="#526078">Explicit emotion control</text>
<path d="M368 160 H430" fill="none" stroke="#657086" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M760 160 H822" fill="none" stroke="#657086" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M992 235 V275 H600 V335" fill="none" stroke="#657086" stroke-width="2" marker-end="url(#arrow)"/>
<text x="700" y="265" font-size="22" font-weight="400" fill="#75639c">Label embedding E(q)</text>
<text x="48" y="313" font-size="28" font-weight="650" fill="#365a8c">02  /  ADAPT THE CONDITION</text>
<rect x="48" y="345" width="320" height="150" rx="12" fill="#ffffff" stroke="#d5dbe5" stroke-width="1.5"/>
<text x="70" y="387" font-size="28" font-weight="650" fill="#20283e">Multimodal features</text>
<text x="70" y="424" font-size="22" font-weight="400" fill="#526078">Emotion sketch: 32 × 16</text>
<text x="70" y="453" font-size="22" font-weight="400" fill="#526078">Visual features: 32 × 512</text>
<rect x="440" y="345" width="320" height="150" rx="12" fill="#eaf2fa" stroke="#b7ccdf" stroke-width="1.5"/>
<text x="462" y="387" font-size="28" font-weight="650" fill="#20283e">EmotionSketch</text>
<text x="462" y="424" font-size="22" font-weight="400" fill="#526078">Sketch + label fusion</text>
<text x="462" y="453" font-size="22" font-weight="400" fill="#526078">Gated visual residual</text>
<rect x="832" y="345" width="320" height="150" rx="12" fill="#eef0f5" stroke="#c8cdd8" stroke-width="1.5"/>
<text x="854" y="387" font-size="28" font-weight="650" fill="#20283e">Frozen Diff-BGM</text>
<text x="854" y="424" font-size="22" font-weight="400" fill="#526078">Adapted visual condition</text>
<text x="854" y="453" font-size="22" font-weight="400" fill="#526078">Conditional denoising</text>
<path d="M368 420 H430" fill="none" stroke="#657086" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M760 420 H822" fill="none" stroke="#657086" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M208 495 V535 H992 V505" fill="none" stroke="#657086" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="410" y="525" font-size="22" font-weight="400" fill="#657086">Reference piano roll + noise</text>
<path d="M1090 495 V585 H24 V725 H38" fill="none" stroke="#657086" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="618" font-size="28" font-weight="650" fill="#75639c">03  /  DECODE, SCORE &amp; SELECT</text>
<rect x="48" y="650" width="320" height="150" rx="12" fill="#ffffff" stroke="#d5dbe5" stroke-width="1.5"/>
<text x="70" y="692" font-size="28" font-weight="650" fill="#20283e">MIDI candidates</text>
<text x="70" y="729" font-size="22" font-weight="400" fill="#526078">Conditional decoding</text>
<text x="70" y="758" font-size="22" font-weight="400" fill="#526078">Candidate pool per target</text>
<rect x="440" y="650" width="320" height="150" rx="12" fill="#f0edf7" stroke="#d6cfe4" stroke-width="1.5"/>
<text x="462" y="692" font-size="28" font-weight="650" fill="#20283e">MFAE evaluator</text>
<text x="462" y="729" font-size="22" font-weight="400" fill="#526078">48 EMOPIA MIDI features</text>
<text x="462" y="758" font-size="22" font-weight="400" fill="#526078">Emotion scoring + selection</text>
<rect x="832" y="650" width="320" height="150" rx="12" fill="#ffffff" stroke="#d5dbe5" stroke-width="1.5"/>
<text x="854" y="692" font-size="28" font-weight="650" fill="#20283e">Target MIDI</text>
<text x="854" y="729" font-size="22" font-weight="400" fill="#526078">Selected symbolic music</text>
<text x="854" y="758" font-size="22" font-weight="400" fill="#526078">for the requested emotion</text>
<path d="M368 725 H430" fill="none" stroke="#657086" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M760 725 H822" fill="none" stroke="#657086" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="852" font-size="20" font-weight="600" fill="#657086">COMPONENT INTERFACES</text>
<text x="390" y="852" font-size="22" font-weight="400" fill="#657086">Music experiments use teacher-forced conditional denoising.</text>
</g>
</svg>
