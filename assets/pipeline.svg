<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
<title id="title">EmotionSketch-BGM method and component interfaces</title>
<desc id="desc">A Chinese prompt is routed to an emotion label. A 16-dimensional sketch and the label adapt visual features through a trainable gated residual. A frozen Diff-BGM backbone denoises reference symbolic music. Quadrant-specific decoding policies create candidates; an EMOPIA-derived MIDI evaluator scores and selects target MIDI.</desc>
